name: Automated Model Retraining

on:
  schedule:
    - cron: "0 2 * * 0" # Runs every Sunday at 02:00 UTC
  workflow_dispatch:
    inputs:
      force_promotion:
        description: "Force model promotion if quality gates pass"
        required: false
        default: "false"
        type: boolean

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Retraining Workflow
        run: |
          python -m mlops_platform.monitoring.retraining
