name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Unit & Integration Tests (pytest)
        run: |
          pytest tests -v --cov=src/mlops_platform --cov-report=xml --cov-report=term

      - name: Lightweight Smoke Training Pipeline
        run: |
          python scripts/run_pipeline.py --samples 500
